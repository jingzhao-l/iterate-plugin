name: oidc claims probe

# TEMPORARY diagnostic workflow — not part of the release path.
# Prints the OIDC identity GitHub presents (audience=npm) so it can be compared,
# field by field, against the Trusted Publisher entry on npmjs.com.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Runner identity
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_REPOSITORY_OWNER=$GITHUB_REPOSITORY_OWNER"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "ID_TOKEN_URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "ID_TOKEN_REQUEST_TOKEN set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"

      - name: OIDC claims for audience npm
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm" > /tmp/oidc.json
          python3 -c "import base64,json;raw=json.load(open('/tmp/oidc.json'))['value'];p=raw.split('.')[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));keys=['iss','aud','sub','repository','repository_owner','repository_id','repository_visibility','ref','sha','event_name','environment','job_workflow_ref','workflow_ref'];print(json.dumps({k:c.get(k) for k in keys},indent=2))"

      - name: npm trusted-publishing probe
        run: |
          npm install -g npm@^11.5.1 >/dev/null 2>&1
          echo "npm $(npm --version) on node $(node --version)"
          echo "--- npm whoami ---"
          npm whoami 2>&1 || echo "whoami exited $?"
          echo "--- npm ping ---"
          npm ping 2>&1 | tail -3 || true
